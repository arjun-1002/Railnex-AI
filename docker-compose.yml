version: '3.8'

services:
  railnex-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: railnex-ai:latest
    container_name: railnex_ai_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
