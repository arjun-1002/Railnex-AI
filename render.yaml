# ==============================================================================
# Railnex AI — Render.com Unified Blueprint
# Deploys FastAPI backend + pre-compiled React 18 SPA via Multi-Stage Dockerfile
# ==============================================================================
services:
  - type: web
    name: railnex-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health
    autoDeploy: true
